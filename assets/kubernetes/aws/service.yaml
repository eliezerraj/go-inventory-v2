apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-go-inventory-v2
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 7000
    targetPort: 7000
    protocol: TCP
    name: http
  selector:
    app: go-inventory-v2
---
apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-go-inventory-v2-metrics
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: metrics
  selector:
    app: go-inventory-v2